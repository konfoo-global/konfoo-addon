name: Auto-Release

on:
  workflow_dispatch:
  push:
    branches:
      - "edge"

permissions:
  contents: write
  packages: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [ '21.0', '20.0', '19.0', '18.0', '17.0', '16.0', '15.0' ]
    container:
      image: "ghcr.io/konfoo-global/konfoo-omvbs:latest"
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure git
        run: |
          git config --global user.name 'Automation'
          git config --global user.email 'info@konfoo.com'
          git config --global --add safe.directory $(pwd)
      - name: Build release
        run: /opt/release.sh
      - name: Push changes
        run: git push
